version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.25
    working_directory: ~/project

jobs:
  test:
    executor: go-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.work" }}-{{ checksum "go.mod" }}
      - run:
          name: "Download Dependencies"
          command: go mod download
      - save_cache:
          key: go-mod-v4-{{ checksum "go.work" }}-{{ checksum "go.mod" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: "Run Unit Tests"
          command: go test -v ./...
      - persist_to_workspace:
          root: .
          paths:
            - .

  build_binary:
    executor: go-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: "Build Dashboard Server"
          command: go build -o bin/dashboard-server ./cmd/dashboard-server/main.go
      - persist_to_workspace:
          root: .
          paths:
            - bin/

  build_docker:
    machine:
      image: ubuntu-2204:2023.10.1
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: "Build Docker Image"
          command: |
            docker build -t dashboard-api:latest \
              -f deploy/docker/Dashboard.Dockerfile .

workflows:
  version: 2
  build_and_test:
    jobs:
      - test
      - build_binary:
          requires:
            - test
      - build_docker:
          requires:
            - build_binary