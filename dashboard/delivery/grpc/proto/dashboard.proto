syntax = "proto3";

package dashboard;

option go_package = "github.com/jassus213/go-board/dashboard/delivery/grpc/gen";

service DashboardService {
  rpc StreamUpdates (stream UpdateRequest) returns (stream UpdateResponse);
  rpc IncrementScore (IncrementScoreRequest) returns (IncrementScoreResponse);
  rpc GetMemberRank (GetMemberRankRequest) returns (GetMemberRankResponse);
  rpc GetTopMembers (GetTopMembersRequest) returns (GetTopMembersResponse);
  rpc GetDashboardStats (GetDashboardStatsRequest) returns (GetDashboardStatsResponse);
}

message UpdateRequest {
  string dashboard = 1;
  string member_id = 2;
  double increment = 3;
}

message UpdateResponse {
  string member_id = 1;
  int64 rank = 2;
  double score = 3;
  reserved 4;
  ProblemDetails problem = 5;
}

message ProblemDetails {
  string type = 1;
  string title = 2;
  int32 status = 3;
  string detail = 4;
  string instance = 5;
  string code = 6;
}

message IncrementScoreRequest {
  string dashboard = 1;
  string member_id = 2;
  double increment = 3;
}

message IncrementScoreResponse {
  string member_id = 1;
  int64 rank = 2;
}

message GetMemberRankRequest {
  string dashboard = 1;
  string member_id = 2;
}

message GetMemberRankResponse {
  string member_id = 1;
  int64 rank = 2;
}

message GetTopMembersRequest {
  string dashboard = 1;
  int64 limit = 2;
}

message MemberRecord {
  string member_id = 1;
  int64 rank = 2;
  double score = 3;
}

message GetTopMembersResponse {
  repeated MemberRecord members = 1;
}

message GetDashboardStatsRequest {
  string dashboard = 1;
}

message GetDashboardStatsResponse {
  int64 total_members = 1;
}