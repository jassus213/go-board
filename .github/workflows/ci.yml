name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Create Go workspace
        run: |
          go work init
          go work use -r .

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: dashboard

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Create Go workspace
        run: |
          go work init
          go work use -r .

      - name: Download dependencies
        run: |
          go mod download
          cd dashboard
          go mod download

      - name: Run tests
        run: |
          go test -v -race ./...
          cd dashboard
          go test -v -race -coverprofile=../coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Create Go workspace
        run: |
          go work init
          go work use -r .

      - name: Build binary
        run: |
          mkdir -p bin
          go build -v -o bin/dashboard-server ./cmd/dashboard-server/main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-server
          path: bin/dashboard-server

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: false
          tags: goboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment to push to Docker Hub
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Push to Docker Hub
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./deploy/docker/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKER_USERNAME }}/goboard:latest
      #       ${{ secrets.DOCKER_USERNAME }}/goboard:${{ github.sha }}

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Create Go workspace
        run: |
          go work init
          go work use -r .

      - name: Run benchmarks
        run: |
          cd dashboard
          go test -bench=. -benchmem ./auth/... > ../benchmark.txt || echo "No benchmarks found"
          cat ../benchmark.txt

      - name: Comment benchmark results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            try {
              const benchmark = fs.readFileSync('benchmark.txt', 'utf8');
              if (benchmark.trim().length > 0 && !benchmark.includes('No benchmarks found')) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## 📊 Benchmark Results\n\`\`\`\n${benchmark}\n\`\`\``
                });
              }
            } catch (error) {
              console.log('Could not post benchmark results:', error.message);
            }