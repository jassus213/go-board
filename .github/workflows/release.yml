name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create Go workspace
        run: |
          go work init
          go work use -r .

      - name: Build binaries
        run: |
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -o dist/dashboard-server-linux-amd64 \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            ./cmd/dashboard-server/main.go
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o dist/dashboard-server-linux-arm64 \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            ./cmd/dashboard-server/main.go
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -o dist/dashboard-server-darwin-amd64 \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            ./cmd/dashboard-server/main.go
          
          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o dist/dashboard-server-darwin-arm64 \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            ./cmd/dashboard-server/main.go
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -o dist/dashboard-server-windows-amd64.exe \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            ./cmd/dashboard-server/main.go

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "First release"
            CHANGELOG="Initial release"
          else
            echo "Changes since $PREV_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..${{ github.ref_name }})
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            Download the appropriate binary for your platform:
            
            **Linux:**
            ```bash
            # AMD64
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dashboard-server-linux-amd64
            chmod +x dashboard-server-linux-amd64
            ./dashboard-server-linux-amd64
            
            # ARM64
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dashboard-server-linux-arm64
            chmod +x dashboard-server-linux-arm64
            ./dashboard-server-linux-arm64
            ```
            
            **macOS:**
            ```bash
            # Intel Mac
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dashboard-server-darwin-amd64
            chmod +x dashboard-server-darwin-amd64
            ./dashboard-server-darwin-amd64
            
            # Apple Silicon (M1/M2)
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dashboard-server-darwin-arm64
            chmod +x dashboard-server-darwin-arm64
            ./dashboard-server-darwin-arm64
            ```
            
            **Windows:**
            Download `dashboard-server-windows-amd64.exe` and run it.
            
            ## Docker
            
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            
            ## Checksums
            
            See `checksums.txt` for SHA256 checksums of all binaries.
          files: |
            dist/*
          draft: false
          prerelease: false

  docker-release:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dashboard.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64