version: "2"

linters:
  default: none
  enable:
    # Корректность
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

    # Безопасность
    - gosec

    # Сложность
    - cyclop
    - funlen
    - gocognit

    # Хорошие практики
    - gocritic
    - bodyclose
    - nilerr
    - errorlint
    - misspell
    - godot
    - whitespace
    - noctx
    - sqlclosecheck
    - unparam
    - exhaustive
  settings:
    cyclop:
      max-complexity: 10

    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    gosec:
      excludes:
        - G115

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - errcheck
          - gosec
          - cyclop
          - godot

      - path: "internal/tests/"
        linters:
          - funlen
          - gocognit
          - cyclop
          - godot

formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
